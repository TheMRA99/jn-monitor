name: jana-nayagan-monitor

# Self-chaining design. A single long-running job (5h loop) turned out to be
# fragile: on 2026-08-31 the runner was killed mid-loop after ~3h with no
# error (an infra reclaim, not a script bug), and GitHub's `schedule:` cron
# then failed to restart it for 1h+ afterward too — a silent multi-hour outage.
#
# Now each run does ONE check (a few seconds) and, on success, dispatches the
# NEXT run itself via a direct API call ~3 min later, then exits. Continuity
# comes from that direct dispatch, not from GitHub's cron (which is known to
# be delayed/dropped under load). `schedule:` stays only as a safety net to
# restart the chain if a link ever dies before it can dispatch the next one —
# worst case gap is now one cron interval, not unbounded.
on:
  schedule:
    - cron: "*/15 * * * *"     # safety net only — restarts the chain if broken
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email and exit (does not touch alert state)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write               # required to self-dispatch the next run

concurrency:
  group: monitor
  cancel-in-progress: true     # a fresh chain link supersedes a stale one

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet certifi curl_cffi

      - name: Test email
        if: ${{ github.event.inputs.test_email == 'true' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python monitor.py --test

      - name: Run monitor
        if: ${{ github.event.inputs.test_email != 'true' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python monitor.py

      - name: Persist alert state
        if: ${{ github.event.inputs.test_email != 'true' }}
        run: |
          if [[ -n "$(git status --porcelain state.json 2>/dev/null)" ]]; then
            git config user.name "jn-monitor-bot"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "update seen showtimes"
            git pull --rebase --autostash origin master || true
            git push
          fi

      # Runs even if an earlier step failed (always()), and every dispatch attempt
      # has a hard timeout + retries. On 2026-11-04 a hung `gh` call here ran into
      # the 10-min job timeout, no next link was dispatched, and the chain died
      # for ~2h because the cron safety net did not fire either.
      - name: Chain next run (~3 min)
        if: ${{ always() && github.event.inputs.test_email != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 150
          for i in 1 2 3 4 5; do
            if timeout 40 gh workflow run monitor.yml --repo ${{ github.repository }}; then
              exit 0
            fi
            echo "dispatch attempt $i failed; retrying"
            sleep 10
          done
          echo "all dispatch attempts failed" >&2
          exit 1
